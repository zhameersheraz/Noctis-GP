name: Deploy to GitHub Pages

# The game is a static Vite build, so Pages just needs the contents of dist/.
# vite.config.ts already uses base: './', so the bundle loads correctly from a
# project subpath such as https://<user>.github.io/<repo>/ without any change.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; never cancel it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Same gate the local build runs, so a broken commit never reaches Pages.
      - name: Typecheck
        run: npm run typecheck

      - name: Circuit verification
        run: npm run verify

      - name: Build
        run: npx vite build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Best effort: asks the action to create the Pages site itself.
          # Note that on a user-owned repo this is NOT sufficient on a brand
          # new repository - the first run still fails with "Get Pages site
          # failed" because GITHUB_TOKEN cannot create the site. The owner has
          # to switch it on once: Settings -> Pages -> Build and deployment
          # -> Source: GitHub Actions. Every later push deploys unattended.
          enablement: true
